<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080">
  <rect width="1400" height="1080" fill="#f4f7fb"/>
  <style>
    text { font-family: "Malgun Gothic", "Noto Sans KR", sans-serif; fill: #172033; }
    .title { font-size: 38px; font-weight: 700; }
    .section { font-size: 29px; font-weight: 700; }
    .head { font-size: 23px; font-weight: 700; fill: #ffffff; }
    .cell { font-size: 22px; font-weight: 500; }
    .score { font-size: 22px; font-weight: 700; fill: #2856a6; }
    .line { stroke: #cbd5e1; stroke-width: 2; }
  </style>

  <text x="700" y="70" text-anchor="middle" class="title">자세 분석 점수 기준표</text>

  <!-- Neck table -->
  <rect x="90" y="115" width="1220" height="415" rx="18" fill="#ffffff"/>
  <text x="125" y="165" class="section">표 1. 목 자세 점수 기준표</text>
  <rect x="125" y="195" width="1150" height="58" rx="8" fill="#315ea8"/>
  <text x="412" y="232" text-anchor="middle" class="head">측정 기준</text>
  <text x="865" y="232" text-anchor="middle" class="head">목 기울기</text>
  <text x="1163" y="232" text-anchor="middle" class="head">점수</text>

  <line x1="700" y1="195" x2="700" y2="493" class="line"/>
  <line x1="1030" y1="195" x2="1030" y2="493" class="line"/>
  <line x1="125" y1="301" x2="1275" y2="301" class="line"/>
  <line x1="700" y1="349" x2="1275" y2="349" class="line"/>
  <line x1="700" y1="397" x2="1275" y2="397" class="line"/>
  <line x1="700" y1="445" x2="1275" y2="445" class="line"/>
  <line x1="125" y1="493" x2="1275" y2="493" class="line"/>

  <text x="412" y="366" text-anchor="middle" class="cell">귀와 어깨 좌표를 연결한 선의 기울기</text>
  <text x="865" y="285" text-anchor="middle" class="cell">10° 이하</text>
  <text x="1163" y="285" text-anchor="middle" class="score">100점</text>
  <text x="865" y="333" text-anchor="middle" class="cell">10° 초과~20° 이하</text>
  <text x="1163" y="333" text-anchor="middle" class="score">85점</text>
  <text x="865" y="381" text-anchor="middle" class="cell">20° 초과~35° 이하</text>
  <text x="1163" y="381" text-anchor="middle" class="score">70점</text>
  <text x="865" y="429" text-anchor="middle" class="cell">35° 초과~50° 이하</text>
  <text x="1163" y="429" text-anchor="middle" class="score">50점</text>
  <text x="865" y="477" text-anchor="middle" class="cell">50° 초과</text>
  <text x="1163" y="477" text-anchor="middle" class="score">30점</text>

  <!-- Waist table -->
  <rect x="90" y="565" width="1220" height="365" rx="18" fill="#ffffff"/>
  <text x="125" y="615" class="section">표 2. 허리 자세 점수 기준표</text>
  <rect x="125" y="645" width="1150" height="58" rx="8" fill="#2f7a65"/>
  <text x="412" y="682" text-anchor="middle" class="head">측정 기준</text>
  <text x="865" y="682" text-anchor="middle" class="head">허리 기울기</text>
  <text x="1163" y="682" text-anchor="middle" class="head">점수</text>

  <line x1="700" y1="645" x2="700" y2="895" class="line"/>
  <line x1="1030" y1="645" x2="1030" y2="895" class="line"/>
  <line x1="125" y1="751" x2="1275" y2="751" class="line"/>
  <line x1="700" y1="799" x2="1275" y2="799" class="line"/>
  <line x1="700" y1="847" x2="1275" y2="847" class="line"/>
  <line x1="125" y1="895" x2="1275" y2="895" class="line"/>

  <text x="412" y="812" text-anchor="middle" class="cell">어깨와 골반 좌표를 연결한 선의 기울기</text>
  <text x="865" y="735" text-anchor="middle" class="cell">5° 이하</text>
  <text x="1163" y="735" text-anchor="middle" class="score">100점</text>
  <text x="865" y="783" text-anchor="middle" class="cell">5° 초과~12° 이하</text>
  <text x="1163" y="783" text-anchor="middle" class="score">80점</text>
  <text x="865" y="831" text-anchor="middle" class="cell">12° 초과~20° 이하</text>
  <text x="1163" y="831" text-anchor="middle" class="score">60점</text>
  <text x="865" y="879" text-anchor="middle" class="cell">20° 초과</text>
  <text x="1163" y="879" text-anchor="middle" class="score">35점</text>

  <text x="700" y="1000" text-anchor="middle" style="font-size:19px; fill:#64748b;">목: 귀–어깨 좌표 기준  ·  허리: 어깨–골반 좌표 기준</text>
</svg>
